app_name: OpenQuantMaster
environment: development

paths:
  artifacts: ./artifacts
  logs: ./logs
  database: ./data/runtime.db
  pipelines: ./pipelines

scheduler:
  timezone: UTC

event_bus:
  backend: memory

logging:
  level: INFO
  format: json

market_data:
  crypto:
    default_exchange: binance
    sandbox: false
    exchange_keys: {}
  equities:
    tushare_token: ""
    yfinance_timeout: 30

vibe_trading:
  mode: cli
  cli_path: vibe-trading
  mcp_command: vibe-trading-mcp
  mcp_url: stdio
  http_url: http://localhost:8000
  auto_start_mcp: true
  read_only: true
  allowed_capabilities:
    - backtest
    - research
    - alpha_bench
    - swarm
    - hypothesis
    - web_search

agent:
  adapter: "claude"
  default_cli: "claude"
  timeout_sec: 300
  workdir: ""  # defaults to the config file's directory at bootstrap
  headless_args: []

mcp:
  enabled: false
  transport: "stdio"
  port: 8711

notifier:
  telegram:
    enabled: false
    bot_token: ""
    chat_id: ""
  pushplus:
    enabled: true
    token: ""
  email:
    enabled: false
    smtp_host: ""
    smtp_port: 465
    username: ""
    password: ""
    from_addr: ""
    to_addrs: []

openalice:
  workspace_id: auto-quant-clear-willow-field
  cli_gateway_url: http://127.0.0.1:47332
  export: data

llm:
  provider: openai
  model: gpt-4o-mini
  api_key: ""
  api_base: ""
  timeout: 30

# Per-tool configuration overrides. Each tool can override any LLM field;
# fields not listed inherit from the global `llm` block above.
# Example:
# tools:
#   news_filter_tool:
#     llm:
#       model: gpt-4o-mini
#       timeout: 15
#   some_analysis_tool:
#     llm:
#       model: anthropic/claude-3-5-sonnet-20241022
#       api_key: sk-ant-...
tools: {}
