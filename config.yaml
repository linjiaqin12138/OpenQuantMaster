app_name: OpenQuantMaster
environment: development

paths:
  artifacts: ./artifacts
  logs: ./logs
  database: ./data/runtime.db

scheduler:
  timezone: UTC

event_bus:
  backend: memory

logging:
  level: INFO
  format: json

market_data:
  crypto:
    default_exchange: binance
    sandbox: false
    exchange_keys: {}
  equities:
    tushare_token: ""
    yfinance_timeout: 30

vibe_trading:
  mode: cli
  cli_path: vibe-trading
  http_url: http://localhost:8000
  mcp_url: stdio
