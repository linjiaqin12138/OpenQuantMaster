name: hourly_review
version: "1.0"
description: 每小时定时研判：SUI/USDT 指标+形态 ∥ 新闻过滤 → OpenAlice 研判提案 → PushPlus 通知。
trigger:
  type: cron
  cron: "3 * * * *"
  timezone: UTC
stages:
  - name: context
    tool: parallel_tool
    inputs:
      calls:
        indicators:
          tool: indicator_tool
          inputs:
            source: "symbol"
            symbol: "SUI/USDT"
            market: "crypto"
            interval: "1h"
            limit: 200
            patterns: ["engulfing", "hammer", "shootingstar", "doji", "morningstar", "eveningstar"]
        news_digest:
          tool: news_filter_tool
          inputs:
            window_minutes: 60

  - name: decide
    tool: openalice_tool
    inputs:
      prompt: |
        定时研判任务（每小时）。末尾附最近 1 小时 SUI/USDT 的技术指标、K 线形态与新闻评分明细（JSON）。
        请依次完成：
        1. 读取并更新 workspace 里的 news/active-narratives.md（活跃叙事生命周期：新发/发展中/衰减/已消化；前几个周期的事件按生命周期衰减，不要滑出窗口就遗忘）；
        2. 若数据中出现价格异动或高分新闻，用 `alice rss window`（或 `alice rss glob/grep`）回溯 24h~7d 找驱动事件，不要只看最近 1 小时；
        3. 用 alice-uta 查询当前 Binance 账户仓位与挂单；
        4. 综合研判后给出操作建议——本期为「研判+提案」模式：不要实际下单，只输出建议动作与理由；若建议执行，给出应挂的具体单（方向/数量/价格），止损必须分腿单独挂单，不得附带 TP/SL；
        5. 最后用一段话给出面向用户的中文总结（结论先行，含关键价格/指标依据）。
      context:
        indicators: "$context.out.indicators.data"
        news_digest: "$context.out.news_digest.data"
      timeout_sec: 600

  - name: notify
    tool: notify_tool
    inputs:
      subject: "OpenAlice 每小时研判"
      body: "$decide.out.response"
      channels: [pushplus]
